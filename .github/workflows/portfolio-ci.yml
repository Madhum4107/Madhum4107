name: Portfolio static checks
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/portfolio-ci.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/portfolio-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate HTML structure and links
        run: python site/validate.py
      - name: Check JavaScript syntax
        run: node --check site/script.js
