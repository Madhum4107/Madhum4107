<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <title>Madhumitha M — Data Science and AI</title>
  <desc>Dark navy banner with gold accents, a clean data visualization, and a focus on data science, machine learning, and applied AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d16"/>
      <stop offset="1" stop-color="#15111a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5b84b"/>
      <stop offset="1" stop-color="#ff754d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9fb0c4" stroke-opacity=".08" stroke-width="1"/>
