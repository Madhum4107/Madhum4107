    <text x="66" y="220" fill="#9aa8ba" font-size="14" letter-spacing="1.5">B.E. CSE (AI &amp; ML) · 2028</text>
    <text x="66" y="248" fill="#9aa8ba" font-size="14" letter-spacing="1.5">OPEN TO DATA SCIENCE &amp; AI INTERNSHIPS</text>
