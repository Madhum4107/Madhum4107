<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Madhumitha M — AI and Data Developer</title>
  <desc id="desc">A dark, modern developer banner with code-inspired details, data visualization, and AI network accents.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b13"/><stop offset=".55" stop-color="#101827"/><stop offset="1" stop-color="#090d17"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="1" stop-color="#c084fc" stop-opacity=".15"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8ba3c7" stroke-opacity=".075" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#base)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="980" cy="95" r="150" fill="#6366f1" opacity=".13" filter="url(#soft)"/>
  <circle cx="790" cy="300" r="110" fill="#06b6d4" opacity=".09" filter="url(#soft)"/>
  <path d="M0 315 C210 270 390 365 610 305 S980 260 1200 315" fill="none" stroke="url(#line)" stroke-width="1.2" opacity=".45"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="68" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="4">PORTFOLIO  /  GITHUB</text>
    <text x="70" y="145" fill="#f8fafc" font-size="57" font-weight="750" letter-spacing="-1.5">MADHUMITHA M</text>
    <rect x="74" y="169" width="390" height="4" rx="2" fill="url(#glow)"/>
    <text x="74" y="215" fill="#dbeafe" font-size="24" font-weight="600">AI  ·  DATA SCIENCE  ·  SOFTWARE</text>
    <text x="74" y="252" fill="#9eacc1" font-size="17">Turning ideas into useful, data-driven applications.</text>
    <g font-size="13" font-weight="600">
      <rect x="74" y="282" width="92" height="30" rx="15" fill="#111c2c" stroke="#334155"/><text x="120" y="301" text-anchor="middle" fill="#cbd5e1">PYTHON</text>
      <rect x="176" y="282" width="76" height="30" rx="15" fill="#111c2c" stroke="#334155"/><text x="214" y="301" text-anchor="middle" fill="#cbd5e1">SQL</text>
      <rect x="262" y="282" width="102" height="30" rx="15" fill="#111c2c" stroke="#334155"/><text x="313" y="301" text-anchor="middle" fill="#cbd5e1">MACHINE LEARNING</text>
      <rect x="374" y="282" width="80" height="30" rx="15" fill="#111c2c" stroke="#334155"/><text x="414" y="301" text-anchor="middle" fill="#cbd5e1">AI / ML</text>
    </g>
  </g>
  <!-- Floating terminal card -->
  <g transform="translate(690 70)">
    <rect width="265" height="190" rx="16" fill="#0b1220" stroke="#334155" stroke-width="1.2"/>
    <path d="M0 42H265" stroke="#263448"/>
    <circle cx="18" cy="21" r="4" fill="#fb7185"/><circle cx="32" cy="21" r="4" fill="#fbbf24"/><circle cx="46" cy="21" r="4" fill="#34d399"/>
    <text x="65" y="25" fill="#64748b" font-family="monospace" font-size="11">developer.py</text>
    <g font-family="monospace" font-size="13">
      <text x="18" y="70" fill="#64748b">01</text><text x="40" y="70" fill="#c084fc">def</text><text x="68" y="70" fill="#e2e8f0"> build_solution():</text>
      <text x="18" y="96" fill="#64748b">02</text><text x="40" y="96" fill="#38bdf8">  data</text><text x="85" y="96" fill="#e2e8f0"> = explore()</text>
      <text x="18" y="122" fill="#64748b">03</text><text x="40" y="122" fill="#38bdf8">  model</text><text x="95" y="122" fill="#e2e8f0"> = learn(data)</text>
      <text x="18" y="148" fill="#64748b">04</text><text x="40" y="148" fill="#38bdf8">  return</text><text x="95" y="148" fill="#a5b4fc"> insight</text>
      <text x="18" y="174" fill="#64748b">05</text><text x="40" y="174" fill="#34d399"># keep building ✦</text>
    </g>
  </g>
  <!-- Data visualization and neural nodes -->
  <g transform="translate(975 95)" stroke="url(#glow)" stroke-width="1.5" fill="none" opacity=".9">
    <path d="M0 0L55 36L105 5L145 60L100 105L55 145L0 110L55 36L100 105L145 60L185 120"/>
    <path d="M0 110L105 5M55 145L185 120M0 0L100 105" opacity=".3"/>
    <g fill="#0b1220" stroke-width="2"><circle cx="0" cy="0" r="6"/><circle cx="55" cy="36" r="6"/><circle cx="105" cy="5" r="6"/><circle cx="145" cy="60" r="6"/><circle cx="100" cy="105" r="6"/><circle cx="55" cy="145" r="6"/><circle cx="0" cy="110" r="6"/><circle cx="185" cy="120" r="6"/></g>
  </g>
  <g transform="translate(1010 265)" fill="none" stroke="#64748b" stroke-width="1.2" opacity=".65">
    <path d="M0 55V0M25 55V25M50 55V12M75 55V35M100 55V5M125 55V20M150 55V40" stroke-linecap="round" stroke-width="6"/>
    <path d="M-8 58H165" stroke="#94a3b8" stroke-width="1"/>
  </g>
  <text x="1120" y="335" text-anchor="end" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">LEARN  /  BUILD  /  SHIP</text>
</svg>